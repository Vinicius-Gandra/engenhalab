name: Segurança da publicação

on:
  push:
    branches: [main, 'security/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: seguranca-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publicacao-segura:
    name: publicacao-segura
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Obter arquivos
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Validar a proteção com casos de regressão
        run: python3 -m unittest discover -s tests/security -v
      - name: Verificar os arquivos que serão publicados
        run: python3 scripts/security/check_publication.py
